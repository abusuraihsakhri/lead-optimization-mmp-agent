name: Tests and validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies and Python syntax
        run: |
          python -m pip check
          python -m compileall -q agents mmp_optimizer cli.py enrichment.py simulator.py

      - name: Run tests
        run: python -m pytest -q

      - name: Check web JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 1) throw new Error('Expected one inline application script');
          new Function(scripts[0][1]);
          console.log('Web script syntax valid');
          NODE

      - name: Verify HMAC signing (temporary CI key)
        run: |
          export AUDIT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -c 'from agents.base import AuditLogger; AuditLogger.log("ci", "test", "CHECK", {"status": "OK"}); assert AuditLogger.verify_integrity()'
