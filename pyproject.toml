[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-optimization-mmp-engine"
version = "2.0.0"
description = "MMP-Optimizer: Matched Molecular Pair (MMP) Lead Optimization Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lead-optimization-mmp-engine = "mmp_optimizer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/lead-optimization-mmp-engine"
Repository = "https://github.com/abusuraihsakhri/lead-optimization-mmp-engine.git"
